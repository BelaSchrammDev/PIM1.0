name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # Only the test project: the script project needs a Space Engineers install
      - run: dotnet test PIM1.0.Tests/PIM1.0.Tests.csproj